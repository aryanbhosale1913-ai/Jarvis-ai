<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>J.A.R.V.I.S</title>
  <style>
    :root {
      --bg: #000000;
      --blue: #00d4ff;
      --blue-bright: #6be8ff;
      --blue-dim: rgba(0, 212, 255, 0.22);
      --blue-glow: rgba(0, 212, 255, 0.55);
      --panel: rgba(4, 16, 26, 0.85);
      --border: rgba(0, 212, 255, 0.28);
      --text: #e6f9ff;
      --muted: #6fb2c9;
      --danger: #ff4d6d;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    body {
      background-image:
        radial-gradient(circle at 50% 24%, rgba(0, 212, 255, 0.11), transparent 55%),
        linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 28px 28px, 28px 28px;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 560px;
      margin: 0 auto;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      position: relative;
    }

    .hud-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px 8px;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(10px);
      z-index: 5;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-title {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--blue-bright);
      text-shadow: 0 0 10px var(--blue-glow);
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 10px;
      letter-spacing: 1.4px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 8px var(--blue);
      transition: background 0.25s, transform 0.25s;
    }

    .hud-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: rgba(0, 212, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--blue-bright);
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 12px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:active {
      transform: scale(0.95);
      background: rgba(0, 212, 255, 0.2);
    }

    .icon-btn.muted {
      color: var(--muted);
      border-color: rgba(111, 178, 201, 0.25);
      background: transparent;
    }

    .core-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px 16px 8px;
      flex-shrink: 0;
    }

    .visualizer-wrap {
      position: relative;
      width: 176px;
      height: 176px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #visualizerCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .ring-outer {
      width: 162px;
      height: 162px;
      border: 1.5px dashed rgba(0, 212, 255, 0.45);
      animation: spinSlow 18s linear infinite;
    }

    .ring-mid {
      width: 132px;
      height: 132px;
      border: 2px solid transparent;
      border-top-color: var(--blue);
      border-bottom-color: var(--blue);
      box-shadow: 0 0 14px rgba(0, 212, 255, 0.25);
      animation: spinReverse 9s linear infinite;
    }

    .ring-inner {
      width: 104px;
      height: 104px;
      border: 1px solid rgba(107, 232, 255, 0.5);
      animation: pulseBreath 3.2s ease-in-out infinite;
    }

    .mic-btn {
      position: relative;
      z-index: 2;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 1.5px solid var(--blue-bright);
      background: radial-gradient(circle, rgba(0, 212, 255, 0.28) 0%, rgba(0, 25, 38, 0.95) 75%);
      color: var(--blue-bright);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 22px rgba(0, 212, 255, 0.45), inset 0 0 14px rgba(0, 212, 255, 0.3);
      transition: transform 0.2s ease, box-shadow 0.25s ease;
    }

    .mic-btn:active {
      transform: scale(0.93);
    }

    .mic-btn svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
      filter: drop-shadow(0 0 6px var(--blue));
    }

    .app[data-state="listening"] .ring-outer { animation-duration: 5s; border-color: var(--blue-bright); }
    .app[data-state="listening"] .ring-mid { animation-duration: 2.5s; }
    .app[data-state="listening"] .mic-btn {
      box-shadow: 0 0 36px var(--blue-bright), inset 0 0 20px var(--blue);
      transform: scale(1.06);
    }
    .app[data-state="listening"] .status-dot {
      background: #00ffcc;
      box-shadow: 0 0 10px #00ffcc;
    }

    .app[data-state="thinking"] .ring-outer { animation-duration: 2.2s; }
    .app[data-state="thinking"] .ring-mid { animation-duration: 1.1s; }
    .app[data-state="thinking"] .status-dot {
      background: #ffd166;
      box-shadow: 0 0 10px #ffd166;
    }

    .app[data-state="speaking"] .ring-inner {
      animation: speakPulse 0.45s ease-in-out infinite alternate;
    }
    .app[data-state="speaking"] .mic-btn {
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.8), inset 0 0 16px rgba(107, 232, 255, 0.45);
    }

    .notice-banner {
      margin: 4px 16px 0;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(0, 212, 255, 0.08);
      color: var(--blue-bright);
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
      display: none;
    }

    .notice-banner.visible {
      display: block;
    }

    .chat-log {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .msg {
      max-width: 86%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.45;
      word-wrap: break-word;
      animation: fadeUp 0.22s ease;
      position: relative;
    }

    .msg-user {
      align-self: flex-end;
      background: rgba(0, 212, 255, 0.14);
      border: 1px solid rgba(0, 212, 255, 0.45);
      border-bottom-right-radius: 4px;
      color: #ffffff;
    }

    .msg-ai {
      align-self: flex-start;
      background: var(--panel);
      border: 1px solid var(--border);
      border-left: 3px solid var(--blue);
      border-bottom-left-radius: 4px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
    }

    .msg-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 4px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 10px;
      letter-spacing: 1.1px;
      color: var(--muted);
    }

    .replay-btn {
      background: none;
      border: none;
      color: var(--blue);
      font-family: inherit;
      font-size: 10px;
      padding: 0;
      cursor: pointer;
    }

    .input-dock {
      padding: 10px 14px 12px;
      border-top: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(12px);
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .text-input {
      flex: 1;
      background: rgba(0, 212, 255, 0.06);
      border: 1px solid var(--border);
      border-radius: 22px;
      color: #ffffff;
      padding: 11px 16px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .text-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 12px rgba(0, 212, 255, 0.25);
    }

    .text-input::placeholder {
      color: rgba(111, 178, 201, 0.65);
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--blue);
      background: rgba(0, 212, 255, 0.18);
      color: var(--blue-bright);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 0 12px rgba(0, 212, 255, 0.25);
    }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(6px);
      z-index: 20;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .drawer-backdrop.open {
      display: flex;
    }

    .drawer {
      width: 100%;
      max-width: 560px;
      max-height: 82dvh;
      background: #030b12;
      border-top: 1.5px solid var(--blue);
      border-radius: 20px 20px 0 0;
      padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 -10px 35px rgba(0, 212, 255, 0.2);
      animation: slideUp 0.22s ease;
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .drawer-title {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      color: var(--blue-bright);
      font-size: 14px;
      letter-spacing: 1.8px;
    }

    .drawer-sub {
      font-size: 12px;
      color: var(--muted);
      margin: 0;
    }

    .memory-add-row {
      display: flex;
      gap: 8px;
    }

    .memory-input {
      flex: 1;
      background: rgba(0, 212, 255, 0.06);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    .memory-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 36dvh;
    }

    .memory-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(0, 212, 255, 0.06);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 13px;
    }

    .delete-one {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      padding: 0 4px;
    }

    .danger-row {
      display: flex;
      gap: 8px;
      padding-top: 6px;
      border-top: 1px solid var(--border);
    }

    .btn-danger {
      flex: 1;
      background: rgba(255, 77, 109, 0.12);
      border: 1px solid rgba(255, 77, 109, 0.45);
      color: #ff8fa3;
      border-radius: 10px;
      padding: 10px;
      font-size: 12px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      cursor: pointer;
    }

    @keyframes spinSlow { to { transform: rotate(360deg); } }
    @keyframes spinReverse { to { transform: rotate(-360deg); } }
    @keyframes pulseBreath {
      0%, 100% { transform: scale(1); opacity: 0.55; }
      50% { transform: scale(1.06); opacity: 1; }
    }
    @keyframes speakPulse {
      from { transform: scale(0.96); opacity: 0.7; }
      to { transform: scale(1.1); opacity: 1; }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="app" id="app" data-state="standby">
    <header class="hud-header">
      <div class="brand">
        <div class="brand-title">J.A.R.V.I.S</div>
        <div class="status-row">
          <span class="status-dot"></span>
          <span id="statusText">STANDBY // ARYAN</span>
        </div>
      </div>
      <div class="hud-actions">
        <button class="icon-btn" id="voiceToggleBtn" aria-label="Toggle spoken replies">
          <span id="voiceToggleLabel">VOICE ON</span>
        </button>
        <button class="icon-btn" id="memoryBtn" aria-label="Open memory">
          MEM (<span id="memoryCount">0</span>)
        </button>
      </div>
    </header>

    <section class="core-stage">
      <div class="visualizer-wrap">
        <canvas id="visualizerCanvas" width="352" height="352"></canvas>
        <div class="ring ring-outer"></div>
        <div class="ring ring-mid"></div>
        <div class="ring ring-inner"></div>
        <button class="mic-btn" id="micBtn" aria-label="Tap to speak to JARVIS">
          <svg viewBox="0 0 24 24">
            <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a1 1 0 1 0-2 0 3 3 0 0 1-6 0 1 1 0 1 0-2 0 5 5 0 0 0 4 4.9V19H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-3.1A5 5 0 0 0 17 11z"/>
          </svg>
        </button>
      </div>
      <div class="notice-banner" id="noticeBanner"></div>
    </section>

    <main class="chat-log" id="chatLog"></main>

    <form class="input-dock" id="chatForm">
      <input
        type="text"
        class="text-input"
        id="textInput"
        placeholder="Ask JARVIS or tap mic..."
        autocomplete="off"
      />
      <button type="submit" class="send-btn" id="sendBtn" aria-label="Send message">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </form>
  </div>

  <div class="drawer-backdrop" id="memoryDrawer">
    <div class="drawer">
      <div class="drawer-header">
        <div class="drawer-title">MEMORY // LOCAL STORAGE</div>
        <button class="icon-btn" id="closeDrawerBtn">CLOSE</button>
      </div>
      <p class="drawer-sub">
        Saved locally on this iPhone. JARVIS uses these facts in every conversation.
      </p>
      <div class="memory-add-row">
        <input
          type="text"
          class="memory-input"
          id="newMemoryInput"
          placeholder="Add preference (e.g., Call me Aryan)"
        />
        <button class="icon-btn" id="addMemoryBtn" type="button">ADD</button>
      </div>
      <div class="memory-list" id="memoryList"></div>
      <div class="danger-row">
        <button class="btn-danger" id="clearHistoryBtn" type="button">CLEAR CHAT</button>
        <button class="btn-danger" id="purgeAllBtn" type="button">DELETE ALL MEMORY</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_HISTORY = "jarvis_history_v1";
    const STORAGE_MEMORIES = "jarvis_memories_v1";
    const STORAGE_VOICE_ENABLED = "jarvis_voice_enabled_v1";

    const appEl = document.getElementById("app");
    const statusText = document.getElementById("statusText");
    const chatLog = document.getElementById("chatLog");
    const chatForm = document.getElementById("chatForm");
    const textInput = document.getElementById("textInput");
    const sendBtn = document.getElementById("sendBtn");
    const micBtn = document.getElementById("micBtn");
    const noticeBanner = document.getElementById("noticeBanner");
    const voiceToggleBtn = document.getElementById("voiceToggleBtn");
    const voiceToggleLabel = document.getElementById("voiceToggleLabel");
    const memoryBtn = document.getElementById("memoryBtn");
    const memoryCount = document.getElementById("memoryCount");
    const memoryDrawer = document.getElementById("memoryDrawer");
    const closeDrawerBtn = document.getElementById("closeDrawerBtn");
    const memoryList = document.getElementById("memoryList");
    const newMemoryInput = document.getElementById("newMemoryInput");
    const addMemoryBtn = document.getElementById("addMemoryBtn");
    const clearHistoryBtn = document.getElementById("clearHistoryBtn");
    const purgeAllBtn = document.getElementById("purgeAllBtn");

    let state = "standby";
    let history = loadJSON(STORAGE_HISTORY, []);
    let memories = loadJSON(STORAGE_MEMORIES, []);
    let voiceEnabled = localStorage.getItem(STORAGE_VOICE_ENABLED) !== "false";
    let recognition = null;
    let isListening = false;
    let isBusy = false;

    function loadJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch {
        return fallback;
      }
    }

    function saveJSON(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    function setState(newState, label) {
      state = newState;
      appEl.setAttribute("data-state", newState);
      const defaults = {
        standby: "STANDBY // ARYAN",
        listening: "LISTENING...",
        thinking: "PROCESSING...",
        speaking: "SPEAKING..."
      };
      statusText.textContent = label || defaults[newState];
    }

    function showNotice(text, duration = 6000) {
      noticeBanner.textContent = text;
      noticeBanner.classList.add("visible");
      if (duration > 0) {
        clearTimeout(showNotice._t);
        showNotice._t = setTimeout(() => {
          noticeBanner.classList.remove("visible");
        }, duration);
      }
    }

    function updateVoiceUI() {
      voiceToggleLabel.textContent = voiceEnabled ? "VOICE ON" : "MUTED";
      voiceToggleBtn.classList.toggle("muted", !voiceEnabled);
    }

    function renderMemories() {
      memoryCount.textContent = memories.length;
      memoryList.innerHTML = "";
      if (memories.length === 0) {
        const empty = document.createElement("div");
        empty.style.color = "var(--muted)";
        empty.style.fontSize = "13px";
        empty.textContent = 'No memories saved yet. Tell JARVIS "Remember that..." or add one above.';
        memoryList.appendChild(empty);
        return;
      }

      memories.forEach((item, index) => {
        const row = document.createElement("div");
        row.className = "memory-item";

        const textSpan = document.createElement("span");
        textSpan.textContent = item;

        const delBtn = document.createElement("button");
        delBtn.className = "delete-one";
        delBtn.innerHTML = "&times;";
        delBtn.setAttribute("aria-label", "Delete memory");
        delBtn.onclick = () => {
          memories.splice(index, 1);
          saveJSON(STORAGE_MEMORIES, memories);
          renderMemories();
        };

        row.appendChild(textSpan);
        row.appendChild(delBtn);
        memoryList.appendChild(row);
      });
    }

    function appendMessage(role, text, animate = true) {
      const msgDiv = document.createElement("div");
      msgDiv.className = `msg ${role === "user" ? "msg-user" : "msg-ai"}`;
      if (!animate) msgDiv.style.animation = "none";

      const meta = docume
